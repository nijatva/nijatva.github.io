<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nijatva Editor — web app</title>
<meta name="description" content="Nijatva Editor in the browser. Offline, non-destructive photo editing — nothing is uploaded, every pixel stays on your device.">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./styles.css">
<link rel="icon" href="./editor.svg">
</head>
<body>
<div class="app">
  <div class="top">
    <span class="brand">
      <svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00e0b2"/><stop offset=".45" stop-color="#3b82f6"/><stop offset=".75" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs><circle cx="50" cy="50" r="38" fill="none" stroke="url(#g1)" stroke-width="16" stroke-linecap="round" stroke-dasharray="190 49" transform="rotate(-90 50 50)"/></svg>
      Nijatva Editor
    </span>
    <span class="spacer"></span>
    <button class="tbtn" id="openBtn">Open</button>
    <button class="tbtn" id="undoBtn" disabled>Undo</button>
    <button class="tbtn" id="redoBtn" disabled>Redo</button>
    <button class="tbtn" id="cmpBtn" disabled>Orig</button>
    <button class="tbtn primary" id="saveBtn" disabled>Save</button>
  </div>

  <div class="stage" id="stage">
    <canvas id="view" hidden></canvas>
    <div class="drop" id="drop">
      <div>
        <h1>Edit a photo <b>without uploading it</b></h1>
        <p>Everything runs in this tab. There is no server, no account and no upload — close the tab and nothing is left behind.</p>
        <div class="row">
          <button class="btn primary" id="pickBtn">Choose a photo</button>
          <button class="btn ghost" id="pasteBtn">Paste from clipboard</button>
        </div>
      </div>
    </div>
    <div class="busy" id="busy" hidden>Rendering…</div>
    <div class="hint" id="hint">Drag an image here · or press Ctrl/Cmd+V</div>
  </div>

  <div class="dock" id="dock" hidden>
    <div class="tabs" id="tabs"></div>
    <div class="panel" id="panel"></div>
  </div>
</div>

<input type="file" id="file" accept="image/*" hidden>
<div class="toast" id="toast"></div>

  <script src="./app.js" defer></script>
</body>
</html>
