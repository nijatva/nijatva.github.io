<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1729">
<title>Nijatva File Manager — Web</title>
<style>
  :root{
    --bg:#0F1729; --surface:#182238; --surface2:#1E2A44; --line:#26334F;
    --text:#FFFFFF; --sub:#9AA6B8; --accent:#2F80ED; --violet:#7C6CF0;
    --green:#22C55E; --amber:#F59E0B; --red:#EF4444; --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:900px;margin:0 auto;padding:16px 14px 80px;min-height:100%}
  header.top{display:flex;align-items:center;gap:12px;padding:6px 2px 14px}
  .logo{width:38px;height:38px;border-radius:11px;background:var(--surface2);display:grid;place-items:center;flex:0 0 auto}
  .logo svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .titles{flex:1;min-width:0}
  .titles h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .titles p{margin:2px 0 0;font-size:12px;color:var(--sub)}
  .btn{
    appearance:none;border:0;border-radius:12px;background:var(--surface2);color:var(--text);
    font-size:13px;font-weight:600;padding:10px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;
    transition:transform .08s ease, background .15s ease;
  }
  .btn:active{transform:scale(.96)}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.ghost{background:transparent;border:1px solid var(--line)}
  .crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--accent);padding:2px 2px 12px;min-height:20px}
  .crumb button{background:none;border:0;color:inherit;font:inherit;padding:2px 4px;border-radius:6px;cursor:pointer}
  .crumb button:hover{background:var(--surface2)}
  .crumb .sep{color:var(--sub)}
  .pill{font-size:11px;color:var(--sub);background:var(--surface2);border-radius:999px;padding:4px 10px;margin-left:auto}
  .toolbar{display:grid;grid-template-columns:1fr auto auto auto auto;gap:8px;align-items:center;margin-bottom:14px}
  .search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
  .search input{flex:1;background:none;border:0;color:var(--text);font-size:13px;outline:none}
  .search input::placeholder{color:var(--sub)}
  select{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:9px 10px;font-size:13px;outline:none}
  .list{display:flex;flex-direction:column;gap:8px}
  .list.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
  .item{
    display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:transform .08s ease,border-color .15s ease;
    min-width:0;
  }
  .item:active{transform:scale(.985)}
  .item:hover{border-color:#31415f}
  .list.grid .item{flex-direction:column;align-items:flex-start;gap:8px;padding:14px}
  .ico{width:38px;height:38px;border-radius:11px;background:var(--surface2);display:grid;place-items:center;flex:0 0 auto}
  .ico svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .ico.folder{background:#243a63}
  .ico.img{background:#3a2740}
  .ico.vid{background:#2c2450}
  .ico.aud{background:#123a3f}
  .ico.doc{background:#1b3050}
  .ico.zip{background:#3d3218}
  .meta{min-width:0;flex:1}
  .name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{font-size:11px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acts{display:flex;gap:6px;flex:0 0 auto}
  .iconbtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--sub);display:grid;place-items:center;cursor:pointer}
  .iconbtn:hover{color:var(--text);border-color:#31415f}
  .iconbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:64px 20px;color:var(--sub);text-align:center}
  .empty svg{width:64px;height:64px;stroke:var(--sub);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
  .empty h2{margin:0;font-size:15px;color:var(--text);font-weight:600}
  .empty p{margin:0;font-size:12px;max-width:280px;line-height:1.5}
  footer.stamp{position:fixed;left:0;right:0;bottom:0;padding:8px 14px;text-align:center;font-size:10px;color:#5a6578;background:linear-gradient(to top,var(--bg) 60%,transparent)}
  .modal{position:fixed;inset:0;background:rgba(5,9,17,.86);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
  .modal.open{display:flex}
  .modal .box{background:var(--surface);border:1px solid var(--line);border-radius:18px;max-width:100%;max-height:100%;overflow:auto;padding:16px;width:min(680px,100%)}
  .modal h3{margin:0 0 10px;font-size:14px;word-break:break-all}
  .modal img{max-width:100%;border-radius:12px;display:block}
  .modal pre{white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.6;color:#dbe3ef;margin:0;max-height:60vh;overflow:auto}
  .modal .close{float:right}
  @media (max-width:560px){
    .toolbar{grid-template-columns:1fr auto auto auto}
    .search{grid-column:1/-1}
  }
  @media (max-width:420px){ .titles h1{font-size:15px} .btn{padding:9px 11px;font-size:12px} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M3 7.5h6l2 2.5h10v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 19.5z"/><path d="M3 7.5V6a1.5 1.5 0 0 1 1.5-1.5h4L11 7"/></svg>
    </div>
    <div class="titles">
      <h1>Nijatva File Manager</h1>
      <p id="status">Web · open a folder to begin</p>
    </div>
    <button class="btn primary" id="openBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7h6l2 2.5h10v9.5H3z"/></svg>
      Open folder
    </button>
  </header>

  <div class="crumb" id="crumb"><button data-i="-1">All files</button><span class="pill" id="used">—</span></div>

  <div class="toolbar">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9AA6B8" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" placeholder="Search this folder" autocomplete="off">
    </div>
    <select id="sort">
      <option value="name">Name</option>
      <option value="date">Date modified</option>
      <option value="size">Size</option>
      <option value="type">Type</option>
    </select>
    <button class="iconbtn" id="viewBtn" title="Grid / list">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </button>
    <button class="iconbtn" id="newBtn" title="New folder">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="iconbtn" id="refreshBtn" title="Refresh">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4h-4"/></svg>
    </button>
  </div>

  <div class="list" id="list"></div>
  <div class="empty" id="empty">
    <svg viewBox="0 0 24 24"><path d="M3 7.5h6l2 2.5h10v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 19.5z"/><path d="M3 7.5V6a1.5 1.5 0 0 1 1.5-1.5h4L11 7"/></svg>
    <h2>No folder open</h2>
    <p>Tap <b>Open folder</b> and pick a folder on this device. Nothing is uploaded — every file stays on your computer.</p>
  </div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <button class="iconbtn close" id="closeModal"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
  </div>
</div>

<footer class="stamp">Nijatva File Manager · web v1.0 · 2026-11-23 · offline, no telemetry</footer>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const listEl = $('#list'), emptyEl = $('#empty'), crumbEl = $('#crumb'),
        statusEl = $('#status'), qEl = $('#q'), sortEl = $('#sort');
  let dirHandle = null, rootHandle = null, pathNames = [], pathHandles = [],
      entries = [], grid = false, fallbackFiles = null;

  const fmt = b => {
    if (!b) return '0 B';
    const u = ['B','kB','MB','GB','TB']; let i = 0, n = b;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return (i === 0 ? n.toFixed(0) : n.toFixed(n < 10 ? 2 : 1)) + ' ' + u[i];
  };
  const ext = n => { const i = n.lastIndexOf('.'); return i > 0 ? n.slice(i+1).toLowerCase() : ''; };
  const kindOf = (name, isDir) => {
    if (isDir) return 'folder';
    const e = ext(name);
    if (['jpg','jpeg','png','webp','gif','bmp','heic','svg'].includes(e)) return 'img';
    if (['mp4','mkv','avi','mov','webm','3gp'].includes(e)) return 'vid';
    if (['mp3','wav','flac','aac','ogg','m4a'].includes(e)) return 'aud';
    if (['zip','rar','7z','tar','gz'].includes(e)) return 'zip';
    if (['pdf','doc','docx','xls','xlsx','ppt','pptx','txt','md','csv','json','xml'].includes(e)) return 'doc';
    return 'file';
  };
  const ICONS = {
    folder:'<path d="M3 7.5h6l2 2.5h10v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 19.5z"/><path d="M3 7.5V6a1.5 1.5 0 0 1 1.5-1.5h4L11 7"/>',
    img:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M4 17l5-5 4 4 3-3 4 4"/>',
    vid:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5l5 2.5-5 2.5z"/>',
    aud:'<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',
    doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/>',
    zip:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M12 3v6M12 11v2M12 15v2"/>',
    file:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>'
  };
  const iconSvg = k => '<svg viewBox="0 0 24 24">' + (ICONS[k] || ICONS.file) + '</svg>';

  function setStatus(t){ statusEl.textContent = t; }

  async function openFolder(){
    if (!window.showDirectoryPicker){
      fallbackPick();
      return;
    }
    try {
      rootHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
      dirHandle = rootHandle;
      pathNames = [rootHandle.name];
      await refresh();
    } catch(e){
      if (e && e.name !== 'AbortError') setStatus('Could not open folder: ' + e.message);
    }
  }

  function fallbackPick(){
    const inp = document.createElement('input');
    inp.type = 'file'; inp.webkitdirectory = true; inp.multiple = true;
    inp.onchange = () => {
      fallbackFiles = Array.from(inp.files || []);
      dirHandle = null;
      entries = fallbackFiles.map(f => ({
        name: f.webkitRelativePath.split('/').slice(1).join('/') || f.name,
        kind: 'file', size: f.size, mtime: f.lastModified, file: f
      }));
      pathNames = [fallbackFiles[0] ? fallbackFiles[0].webkitRelativePath.split('/')[0] : 'Files'];
      setStatus(entries.length + ' files · read-only mode (browser without folder access)');
      render();
    };
    inp.click();
  }

  async function refresh(){
    if (!dirHandle) { render(); return; }
    setStatus('Reading…');
    entries = [];
    try {
      for await (const [name, h] of dirHandle.entries()){
        let size = 0, mtime = 0;
        if (h.kind === 'file'){
          try { const f = await h.getFile(); size = f.size; mtime = f.lastModified; } catch(_){}
        }
        entries.push({ name, kind: h.kind === 'directory' ? 'folder' : 'file', handle: h, size, mtime });
      }
      setStatus(entries.length + ' item(s)');
    } catch(e){
      setStatus('Could not read folder: ' + e.message);
    }
    render();
  }

  function visible(){
    const q = qEl.value.trim().toLowerCase();
    let out = entries.filter(e => !q || e.name.toLowerCase().includes(q) || ext(e.name).includes(q));
    const mode = sortEl.value;
    out.sort((a,b) => {
      if ((a.kind === 'folder') !== (b.kind === 'folder')) return a.kind === 'folder' ? -1 : 1;
      if (mode === 'size') return (b.size||0) - (a.size||0);
      if (mode === 'date') return (b.mtime||0) - (a.mtime||0);
      if (mode === 'type') return ext(a.name).localeCompare(ext(b.name)) || a.name.localeCompare(b.name);
      return a.name.localeCompare(b.name, undefined, { numeric: true });
    });
    return out;
  }

  function render(){
    const items = visible();
    listEl.className = 'list' + (grid ? ' grid' : '');
    listEl.innerHTML = '';
    crumbEl.querySelectorAll('button, .sep').forEach(n => n.remove());
    const first = document.createElement('button');
    first.textContent = pathNames[0] || 'All files';
    first.dataset.i = '0';
    crumbEl.prepend(first);
    for (let i = 1; i < pathNames.length; i++){
      const sep = document.createElement('span'); sep.className = 'sep'; sep.textContent = '/';
      const b = document.createElement('button'); b.textContent = pathNames[i]; b.dataset.i = String(i);
      crumbEl.insertBefore(sep, crumbEl.querySelector('.pill'));
      crumbEl.insertBefore(b, crumbEl.querySelector('.pill'));
    }

    if (!entries.length){
      emptyEl.style.display = 'flex';
      listEl.style.display = 'none';
      return;
    }
    emptyEl.style.display = 'none';
    listEl.style.display = grid ? 'grid' : 'flex';

    items.forEach(e => {
      const k = kindOf(e.name, e.kind === 'folder');
      const row = document.createElement('div');
      row.className = 'item';
      const sub = e.kind === 'folder' ? 'Folder' : fmt(e.size) + (e.mtime ? ' · ' + new Date(e.mtime).toLocaleDateString() : '');
      row.innerHTML = `<div class="ico ${k}">${iconSvg(k)}</div>
        <div class="meta"><div class="name"></div><div class="sub"></div></div>
        <div class="acts">
          ${e.kind === 'file' ? '<button class="iconbtn dl" title="Save"><svg viewBox="0 0 24 24"><path d="M12 4v10M8 11l4 4 4-4M5 19h14"/></svg></button>' : ''}
          ${dirHandle ? '<button class="iconbtn rn" title="Rename"><svg viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16z"/></svg></button><button class="iconbtn rm" title="Delete"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V5h6v2M7 7l1 13h8l1-13"/></svg></button>' : ''}
        </div>`;
      row.querySelector('.name').textContent = e.name;
      row.querySelector('.sub').textContent = sub;

      row.querySelector('.meta').onclick = () => { e.kind === 'folder' ? enter(e) : preview(e); };
      row.querySelector('.ico').onclick = () => { e.kind === 'folder' ? enter(e) : preview(e); };
      const dl = row.querySelector('.dl');
      if (dl) dl.onclick = ev => { ev.stopPropagation(); download(e); };
      const rn = row.querySelector('.rn');
      if (rn) rn.onclick = ev => { ev.stopPropagation(); rename(e); };
      const rm = row.querySelector('.rm');
      if (rm) rm.onclick = ev => { ev.stopPropagation(); remove(e); };
      listEl.appendChild(row);
    });
  }

  async function enter(e){
    if (!e.handle || e.kind !== 'folder') return;
    dirHandle = e.handle;
    pathNames.push(e.name);
    qEl.value = '';
    await refresh();
  }

  async function goTo(i){
    if (!rootHandle) return;
    if (i <= 0){ dirHandle = rootHandle; pathNames = [rootHandle.name]; await refresh(); return; }
    let h = rootHandle;
    const names = [rootHandle.name];
    for (let k = 1; k <= i; k++){
      h = await h.getDirectoryHandle(pathNames[k]);
      names.push(pathNames[k]);
    }
    dirHandle = h; pathNames = names; await refresh();
  }

  async function preview(e){
    let file = e.file;
    if (!file && e.handle) file = await e.handle.getFile();
    if (!file) return;
    const t = file.type || '';
    const title = e.name;
    const body = $('#modalBody');
    $('#modalTitle').textContent = title;
    if (t.startsWith('image/') || /\.(png|jpe?g|gif|webp|svg|bmp)$/i.test(e.name)){
      body.innerHTML = '';
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      body.appendChild(img);
    } else if (t.startsWith('text/') || /\.(txt|md|json|xml|csv|log|js|css|html)$/i.test(e.name)){
      const text = await file.text();
      body.innerHTML = '<pre></pre>';
      body.querySelector('pre').textContent = text.slice(0, 200000);
    } else {
      body.innerHTML = '<p style="font-size:13px;color:#9AA6B8">No in-browser preview. Use the save button to download it.</p>';
    }
    $('#modal').classList.add('open');
  }

  async function download(e){
    let file = e.file;
    if (!file && e.handle) file = await e.handle.getFile();
    if (!file) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file);
    a.download = e.name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  async function rename(e){
    if (!dirHandle) return;
    const next = prompt('New name', e.name);
    if (!next || next === e.name) return;
    try {
      if (e.kind === 'file'){
        const file = await e.handle.getFile();
        const nh = await dirHandle.getFileHandle(next, { create: true });
        const w = await nh.createWritable();
        await w.write(file); await w.close();
        await dirHandle.removeEntry(e.name);
      } else {
        alert('Renaming folders is not supported by the browser File System API yet.');
        return;
      }
      await refresh();
    } catch(err){ alert('Could not rename: ' + err.message); }
  }

  async function remove(e){
    if (!dirHandle) return;
    if (!confirm('Delete "' + e.name + '"?')) return;
    try {
      await dirHandle.removeEntry(e.name, { recursive: true });
      await refresh();
    } catch(err){ alert('Could not delete: ' + err.message); }
  }

  async function newFolder(){
    if (!dirHandle) { alert('Open a folder first.'); return; }
    const name = prompt('Folder name');
    if (!name) return;
    try { await dirHandle.getDirectoryHandle(name, { create: true }); await refresh(); }
    catch(err){ alert('Could not create: ' + err.message); }
  }

  $('#openBtn').onclick = openFolder;
  $('#refreshBtn').onclick = refresh;
  $('#newBtn').onclick = newFolder;
  $('#viewBtn').onclick = () => { grid = !grid; render(); };
  qEl.oninput = render;
  sortEl.onchange = render;
  $('#closeModal').onclick = () => $('#modal').classList.remove('open');
  $('#modal').onclick = ev => { if (ev.target.id === 'modal') $('#modal').classList.remove('open'); };
  crumbEl.onclick = ev => { const b = ev.target.closest('button'); if (b) goTo(parseInt(b.dataset.i, 10)); };
})();
</script>
</body>
</html>
